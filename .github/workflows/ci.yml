name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run plugin:check
      - run: npm run plugin:validate
      # Assert the tarball npm would publish vendors every CLI target, not just the runner's
      # platform. Catches the 0.2.1 darwin-only packaging defect before a release can ship it.
      - run: npm run pack:verify
      - run: npm test
